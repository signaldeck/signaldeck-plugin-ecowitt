name: Ecowitt HTTP receiver
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install "signaldeck-sdk @ git+https://github.com/signaldeck/signaldeck-sdk.git@47105617f2ac71acecd3bb4f2d94f79389fab456" "signaldeck-plugin-main @ git+https://github.com/signaldeck/signaldeck-plugin-main.git@e184c8c13e8754d1e9884d69ea1585895886875e" "signaldeck-ui @ git+https://github.com/signaldeck/signaldeck-ui.git@v1.1.beta.1" 
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
